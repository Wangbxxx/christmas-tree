<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Merry Christmas · 极光圣诞树</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<script>
(function () {
  'use strict';

  const TAU = Math.PI * 2;
  const isMobile = Math.min(window.innerWidth, window.innerHeight) < 600 ||
                   /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

  // 手机降低粒子量，保证流畅
  const TREE_POINTS   = isMobile ? 22000 : 50000;
  const GROUND_POINTS = isMobile ? 1800  : 4000;
  const STAR_POINTS   = isMobile ? 600   : 1200;
  const HEART_POINTS  = isMobile ? 600   : 1000;
  const SNOW2D_POINTS = isMobile ? 6     : 10;

  const CAM_DIST   = 13;
  const CAM_HEIGHT = 6.0;
  const PITCH      = -0.25;
  const TREE_HEIGHT = 12.0;

  const params = new URLSearchParams(location.search);
  const subText = params.get('msg') || params.get('name') || 'For You';

  // ============ 三套氛围主题 ============
  const THEMES = {
    aurora: {
      body:   [[0.00,'#0a4f5e'],[0.25,'#155e9c'],[0.50,'#5142b5'],[0.75,'#b14fb0'],[1.00,'#ff9ec9']],
      ribbon: [[0.00,'#ffe0a0'],[0.30,'#ffb06b'],[0.60,'#ff7fa8'],[0.85,'#d98cff'],[1.00,'#ffe0a0']],
      ground: [[0.00,'#3fd6e8'],[0.50,'#6a8cff'],[1.00,'#b073ff']],
      star:   [[0.00,'#cfe4ff'],[0.50,'#e6d4ff'],[1.00,'#ffdcec']],
      heart:  [[0.00,'#ff9ec9'],[0.50,'#ffe0a0'],[1.00,'#fff3d0']],
      bgTop: '#0b0b20', bgBottom: '#020208', bgGlow: '#1c1246',
      text: ['#ffe9c9', '#ffb9a0'], snow: 'rgba(215,232,255,'
    },
    sunset: {
      body:   [[0.00,'#3a1c52'],[0.25,'#832d70'],[0.50,'#c84263'],[0.75,'#f0855c'],[1.00,'#ffd58a']],
      ribbon: [[0.00,'#fff4cf'],[0.35,'#ffc061'],[0.70,'#ff8052'],[1.00,'#fff4cf']],
      ground: [[0.00,'#ff9a6b'],[0.50,'#d4517a'],[1.00,'#8e3b8f']],
      star:   [[0.00,'#ffe9cf'],[0.50,'#ffd0b8'],[1.00,'#ffe0f0']],
      heart:  [[0.00,'#ff8052'],[0.50,'#ffd58a'],[1.00,'#fff4cf']],
      bgTop: '#1d0f26', bgBottom: '#08040c', bgGlow: '#4a1c3a',
      text: ['#ffe6c0', '#ffb08a'], snow: 'rgba(255,235,215,'
    },
    glacier: {
      body:   [[0.00,'#0b3a5c'],[0.25,'#17688f'],[0.50,'#38a8c9'],[0.75,'#8ce4f2'],[1.00,'#eaffff']],
      ribbon: [[0.00,'#ffffff'],[0.30,'#a8f0ff'],[0.60,'#5cc8f0'],[1.00,'#ffffff']],
      ground: [[0.00,'#4fd6e8'],[0.50,'#3a9ac9'],[1.00,'#1e5a9e']],
      star:   [[0.00,'#e6faff'],[0.50,'#cceeff'],[1.00,'#ffffff']],
      heart:  [[0.00,'#8ce4f2'],[0.50,'#eaffff'],[1.00,'#ffffff']],
      bgTop: '#04182b', bgBottom: '#010710', bgGlow: '#0d3a5c',
      text: ['#e6faff', '#a8d8f0'], snow: 'rgba(230,248,255,'
    }
  };
  const themeKey = THEMES[params.get('theme')] ? params.get('theme') : 'aurora';
  const TH = THEMES[themeKey];

  function hex2rgb(h) {
    return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  }
  function buildLut(stops) {
    const n = 256, lut = new Uint8Array(n * 3);
    const ss = stops.map(function (s) { return [s[0], hex2rgb(s[1])]; });
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      let a = ss[0], b = ss[ss.length - 1];
      for (let j = 0; j < ss.length - 1; j++) {
        if (t >= ss[j][0] && t <= ss[j+1][0]) { a = ss[j]; b = ss[j+1]; break; }
      }
      const span = (b[0] - a[0]) || 1;
      const f = (t - a[0]) / span;
      lut[i*3]   = a[1][0] + (b[1][0] - a[1][0]) * f;
      lut[i*3+1] = a[1][1] + (b[1][1] - a[1][1]) * f;
      lut[i*3+2] = a[1][2] + (b[1][2] - a[1][2]) * f;
    }
    return lut;
  }
  const LUTS = [buildLut(TH.body), buildLut(TH.ribbon), buildLut(TH.ground), buildLut(TH.star), buildLut(TH.heart)];

  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function gauss(mu, sigma) {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }

  // ============ 粒子数据（与画布尺寸无关）============
  const pos = [], bands = [], tones = [];
  function pushPoint(x, y, z, band, tone) {
    pos.push(x, y, z);
    bands.push(band);
    tones.push(Math.max(0, Math.min(255, tone)));
  }
  function genTree() {
    const loops = 9;
    const spiralN = Math.floor(TREE_POINTS * 0.7);
    for (let i = 0; i < spiralN; i++) {
      const u = Math.random();
      const h = Math.pow(u, 1.6);
      const y = TREE_HEIGHT * h + 0.2;
      let baseR = Math.pow(1 - h, 1.1) * 3.2;
      baseR *= 1.0 + 0.65 * Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      const angle = u * loops * TAU + (Math.random() * 0.44 - 0.22);
      const r = baseR * (0.85 + Math.random() * 0.23);
      const tone = Math.random() < 0.08 ? randInt(0, 70) : (u * 255) | 0;
      pushPoint(Math.cos(angle) * r, y, Math.sin(angle) * r, 1, tone);
    }
    const fillN = TREE_POINTS - spiralN;
    for (let i = 0; i < fillN; i++) {
      const h = Math.pow(Math.random(), 1.9);
      const y = TREE_HEIGHT * h + 0.2 + (Math.random() * 0.16 - 0.08);
      let baseR = Math.pow(1 - h, 1.1) * 4.3;
      baseR *= 1.0 + 0.65 * Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      const r = baseR * Math.sqrt(Math.random());
      const angle = Math.random() * TAU;
      pushPoint(Math.cos(angle) * r + (Math.random()*0.16-0.08), y,
                Math.sin(angle) * r + (Math.random()*0.16-0.08), 0, (h*255 + randInt(-28,28)) | 0);
    }
  }
  function genGround() {
    const rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4];
    for (let i = 0; i < GROUND_POINTS; i++) {
      const r = gauss(rings[randInt(0, rings.length - 1)], 0.3);
      const theta = Math.random() * TAU;
      pushPoint(Math.cos(theta) * r, -0.25, Math.sin(theta) * r, 2, ((r - 4.6) / 6.8 * 255) | 0);
    }
  }
  function genStars() {
    for (let i = 0; i < STAR_POINTS; i++) {
      pushPoint(Math.random()*36-18, Math.random()*15+3, Math.random()*36-18, 3, randInt(0,255));
    }
  }
  function genHeart() {
    const scale = 0.9, topY = TREE_HEIGHT + 0.05;
    let count = 0;
    while (count < HEART_POINTS) {
      const x = Math.random()*2.6-1.3, y = Math.random()*2.8-1.4;
      const f = Math.pow(x*x + y*y - 1.0, 3) - x*x*Math.pow(y,3);
      if (f <= 0) {
        pushPoint(x*scale*0.8, topY + (y+1.0)*scale*0.5, Math.random()*0.36-0.18,
                  4, ((y+1.4)/2.8*255)|0);
        count++;
      }
    }
  }
  genTree(); genGround(); genStars(); genHeart();

  const N = pos.length / 3;
  const PX = new Float32Array(pos);
  const BAND = new Uint8Array(bands);
  const TONE = new Uint8Array(tones);

  // ============ 雪花 ============
  let W = 1, H = 1;
  const flakes = [];
  function respawn(f) {
    f.x = Math.random() * W;
    f.y = -80 + Math.random() * 70;
    f.r = 10 + Math.random() * 6;
    f.v = 30 + Math.random() * 15;
    f.life = (H + 80 - f.y) / f.v;
    f.max = f.life;
  }

  // ============ 画布与相机（自适应）============
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let img, buf, BG, focal, cx, cy, textGrad, portrait;

  function buildBackground() {
    const bg = new Uint32Array(W * H);
    const top = hex2rgb(TH.bgTop), bot = hex2rgb(TH.bgBottom), glow = hex2rgb(TH.bgGlow);
    for (let y = 0; y < H; y++) {
      const v = y / H;
      const br = top[0] + (bot[0]-top[0])*v;
      const bgG = top[1] + (bot[1]-top[1])*v;
      const bb = top[2] + (bot[2]-top[2])*v;
      for (let x = 0; x < W; x++) {
        const dx = (x - W/2) / (W*0.55);
        const dy = (y - H*(portrait?0.48:0.52)) / (H*0.7);
        const g = Math.max(0, 1 - Math.sqrt(dx*dx + dy*dy));
        const gl = g * g * 0.85;
        const r  = Math.min(255, br  + gl*(glow[0]-br))  | 0;
        const gg = Math.min(255, bgG + gl*(glow[1]-bgG)) | 0;
        const b  = Math.min(255, bb  + gl*(glow[2]-bb))  | 0;
        bg[y*W + x] = (255<<24) | (b<<16) | (gg<<8) | r;
      }
    }
    return bg;
  }

  function setup() {
    const vw = window.innerWidth, vh = window.innerHeight;
    portrait = vh > vw;
    const maxDim = 1600;
    const s = Math.min(1, maxDim / Math.max(vw, vh));
    W = Math.max(320, Math.round(vw * s));
    H = Math.max(480, Math.round(vh * s));
    canvas.width = W; canvas.height = H;

    focal = portrait ? Math.min(W * 0.85, H * 0.5) : H * 0.63;
    cx = W * 0.5;
    cy = portrait ? H * 0.44 : H * 0.5;

    img = ctx.createImageData(W, H);
    buf = new Uint32Array(img.data.buffer);
    BG = buildBackground();

    textGrad = ctx.createLinearGradient(Math.max(12,W*0.04), 0, Math.max(220,W*0.6), 0);
    textGrad.addColorStop(0, TH.text[0]);
    textGrad.addColorStop(1, TH.text[1]);

    for (let i = 0; i < flakes.length; i++) respawn(flakes[i]);
  }
  for (let i = 0; i < SNOW2D_POINTS; i++) { const f = {}; respawn(f); flakes.push(f); }
  setup();
  window.addEventListener('resize', setup);
  window.addEventListener('orientationchange', function () { setTimeout(setup, 120); });

  const pool = new Array(N);
  for (let i = 0; i < N; i++) pool[i] = { d:0, x:0, y:0, s:0, b:0, t:0, c:0 };
  const active = [];
  const cosP = Math.cos(PITCH), sinP = Math.sin(PITCH);

  function plot(px, py, size, color) {
    const r2 = size*size + size;
    for (let y = py-size; y <= py+size; y++) {
      if (y < 0 || y >= H) continue;
      const dy2 = (y-py)*(y-py), row = y*W;
      for (let x = px-size; x <= px+size; x++) {
        if (x < 0 || x >= W) continue;
        const dx = x-px;
        if (dx*dx + dy2 > r2) continue;
        buf[row + x] = color;
      }
    }
  }

  let angle = 0, last = performance.now();

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    angle += 0.0045 * (dt * 60);

    const ts = now * 0.001;
    const shifts = [
      Math.round(Math.sin(ts*0.28)*12), (ts*24)|0,
      Math.round(Math.sin(ts*0.20)*8), Math.round(Math.sin(ts*0.15)*10), (ts*18)|0
    ];

    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    active.length = 0;
    for (let i = 0; i < N; i++) {
      const p = i*3;
      const x = PX[p], y = PX[p+1], z = PX[p+2];
      const xz = x*cosA - z*sinA;
      const zz = x*sinA + z*cosA;
      const yp = y*cosP - zz*sinP;
      const zp = y*sinP + zz*cosP + CAM_DIST;
      if (zp <= 0.1) continue;
      const f = focal / zp;
      const q = pool[i];
      q.d = zp;
      q.x = (cx + xz*f) | 0;
      q.y = (cy - (yp - CAM_HEIGHT)*f) | 0;
      q.s = Math.max(1, (3.6 - zp*0.13) | 0);
      q.b = BAND[i]; q.t = TONE[i];
      active.push(q);
    }
    active.sort((a,b) => b.d - a.d);

    buf.set(BG);
    for (let i = 0; i < active.length; i++) {
      const q = active[i], lut = LUTS[q.b];
      const idx = ((q.t + shifts[q.b]) & 255) * 3;
      q.c = (255<<24) | (lut[idx+2]<<16) | (lut[idx+1]<<8) | lut[idx];
      plot(q.x, q.y, q.s, q.c);
    }
    ctx.putImageData(img, 0, 0);

    // 文字：竖屏放顶部，横屏放左侧
    const fs = portrait ? 26 : 45;
    const tx = Math.max(14, W*0.04);
    const ty = portrait ? 30 : H/3;
    ctx.font = fs + "px 'Monotype Corsiva', 'Segoe Script', cursive";
    ctx.fillStyle = textGrad;
    ctx.textBaseline = 'top';
    ctx.shadowColor = TH.text[0];
    ctx.shadowBlur = 12;
    ctx.fillText('Merry Christmas', tx, ty);
    ctx.fillText(subText, tx, ty + fs + 12);
    ctx.shadowBlur = 0;

    // 雪花
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.y += f.v*dt; f.life -= dt;
      if (f.life <= 0 || f.y > H + 50) { respawn(f); continue; }
      const phase = f.life / f.max;
      let alpha = phase > 0.3 ? 255 : Math.floor(255*(phase/0.3));
      alpha = Math.max(0, Math.min(255, alpha));
      const fx = f.x|0, fy = f.y|0;
      const layers = [[f.r*1.3,alpha/20],[f.r,alpha/12],[f.r*0.75,alpha/6],[f.r*0.55,alpha/3],[f.r*0.45,alpha]];
      for (let L = 0; L < layers.length; L++) {
        const a = Math.max(0, layers[L][1])/255;
        if (a <= 0) continue;
        ctx.beginPath();
        ctx.arc(fx, fy, Math.max(1,layers[L][0]), 0, TAU);
        ctx.fillStyle = TH.snow + a + ')';
        ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
